'// 鍦烘櫙 B锛氬伐鍗曡矾鐢扁€斺€斿叡浜瓙鏉′欢锛坅lpha 鑺傜偣澶嶇敤锛塡n// 涓ゆ潯瑙勫垯鍏变韩 customer.vip==true锛孯ete 鍙紪璇戜竴涓?alpha 鑺傜偣\nlet engine = ReteEngine::new([\n  ReteRule::new("vip_senior", "VIP宸ュ崟杩涜祫娣卞潗甯?,\n    "customer.vip==true && ticket.priority==high",\n    "ticket.route=senior_agent", 10,\n    "VIP + 楂樹紭鍏堢骇"),\n  ReteRule::new("vip_sla", "VIP宸ュ崟鍔犳€?,\n    "customer.vip==true && ticket.priority==high",\n    "ticket.sla=15min", 8,\n    "鍏变韩 VIP 鏉′欢锛屼粎鍔ㄤ綔涓嶅悓"),\n])\n\nlet wm = WorkingMemory::new()\nlet vip = Fact::make("customer"); vip.set("vip", "true"); vip.set("id", "c-7")\nlet tick = Fact::make("ticket"); tick.set("priority", "high"); tick.set("customer_id", "c-7")\nengine.insert(wm, vip); engine.insert(wm, tick)\n\n// alpha_count=2锛歏IP 鏉′欢鍏变韩涓?1 涓妭鐐癸紝鏈噸澶嶇紪璇慭nengine.fire_all(wm)',
      output: ''
    },
    c: {
      rules:
'// 鍦烘櫙 C锛氬簱瀛樹績閿€鈥斺€旇繛閿佹縺娲籠n// 涓嬪崟鈫掓墸搴撳瓨鈫掍綆浜庨槇鍊艰ˉ璐р啋锛堣ˉ璐у悗涓嶅啀瑙﹀彂锛塡nlet engine = ReteEngine::new([\n  ReteRule::new("stock_apply", "涓嬪崟鎵ｅ簱瀛?,\n    "order.status==placed && product.stock>=order.qty",\n    "product.stock-=order.qty & order.status=fulfilled", 10,\n    "璁㈠崟鎴愮珛鍗虫墸搴撳瓨锛堝姩浣滃紩鐢ㄥ叾浠栦簨瀹炲瓧娈碉級"),\n  ReteRule::new("stock_reorder", "浣庡簱瀛樿ˉ璐?,\n    "product.stock<10",\n    "product.stock+=100 & action=reorder_triggered", 8,\n    "浣庝簬闃堝€艰嚜鍔ㄨˉ璐?),\n])\n\nlet wm = WorkingMemory::new()\nlet prod = Fact::make("product"); prod.set("stock", "5")\nlet o1 = Fact::make("order"); o1.set("status", "placed"); o1.set("qty", "2")\nengine.insert(wm, prod); engine.insert(wm, o1)\n\n// 瑙﹀彂閾? stock_apply 鈫?stock_reorder\nengine.fire_all(wm, limit=50)',
      output: ''
    },
    d: {
      rules:
'// 鍦烘櫙 D锛歄R / NOT 澶嶅悎鏉′欢锛圖SL 澧炲己锛塡n// OR  : 浠讳竴缁勫叏閮ㄦ潯浠舵弧瓒冲嵆瑙﹀彂锛堢粍鍙敤鎷彿鍖呰９锛岄《灞?||锛塡n// NOT : 宸ヤ綔鍐呭瓨涓笉瀛樺湪婊¤冻鏉′欢鐨勪簨瀹炴墠婊¤冻锛? 鍓嶇紑锛塡nlet engine = ReteEngine::new([\n  ReteRule::new("or_rule", "VIP閫€娆炬垨澶ч璁㈠崟",\n    "(customer.level==VIP && ticket.type==refund)\n     || order.amount>100000",\n    "action=manual_review", 10,\n    "OR 缁勮涔夛細浠讳竴缁勬弧瓒冲嵆瑙﹀彂"),\n  ReteRule::new("not_rule", "涓嬪崟涓旈潪榛戝悕鍗?,\n    "order.status==placed && !customer.blacklist==true",\n    "action=auto_approve", 8,\n    "NOT 璇箟锛氫笉瀛樺湪榛戝悕鍗曞鎴锋墠瑙﹀彂"),\n])\n\n// OR 缁?1锛歏IP + 閫€娆惧伐鍗?鈫?瑙﹀彂\nlet wm1 = WorkingMemory::new()\nlet c = Fact::make("customer"); c.set("level", "VIP")\nlet t = Fact::make("ticket"); t.set("type", "refund")\nengine.insert(wm1, c); engine.insert(wm1, t)\nengine.fire_all(wm1)\n\n// OR 缁?2锛氬ぇ棰濊鍗曪紙鏃?VIP锛夆啋 涔熻Е鍙慭nlet wm2 = WorkingMemory::new()\nlet o = Fact::make("order"); o.set("amount", "150000")\nengine.insert(wm2, o)\nengine.fire_all(wm2)\n\n// NOT锛歱laced 璁㈠崟锛屾棤瀹㈡埛 鈫?瑙﹀彂\nlet wm3 = WorkingMemory::new()\nlet o2 = Fact::make("order"); o2.set("status", "placed")\nengine.insert(wm3, o2)\nengine.fire_all(wm3)\n\n// NOT 鎷︽埅锛歱laced 璁㈠崟 + 榛戝悕鍗曞鎴?鈫?涓嶈Е鍙慭nlet wm4 = WorkingMemory::new()\nlet b = Fact::make("customer"); b.set("blacklist", "true")\nlet o3 = Fact::make("order"); o3.set("status", "placed")\nengine.insert(wm4, b); engine.insert(wm4, o3)\nengine.fire_all(wm4)',
      output: ''
    }
  };

  (function(){
    var rulesPre = document.getElementById('rules-pre');
    var outPre = document.getElementById('engine-out-pre');
    var tabs = document.querySelectorAll('.tab');
    function showScene(key){
      tabs.forEach(function(t){ t.className = 'tab' + (t.dataset.scene === key ? ' active' : ''); });
      rulesPre.textContent = SCENES[key].rules;
      outPre.textContent = SCENES[key].output || 'loading engine...';
    }
    tabs.forEach(function(t){
      t.addEventListener('click', function(){ showScene(t.dataset.scene); });
    });
    showScene('a');
    fetch('moonup.wasm')
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
      .then(function(bytes){ return WebAssembly.instantiate(bytes, {}, { builtins:['js-string'], importedStringConstants:'_' }); })
      .then(function(res){ return res.instance.exports; })
      .then(function(exports){
        var raw = exports.moonup_rete_demo();
        var parts = raw.split('--- 鍦烘櫙');
        SCENES.a.output = parts[1] ? '鍦烘櫙' + parts[1].trim() : '(no output)';
        SCENES.b.output = parts[2] ? '鍦烘櫙' + parts[2].trim() : '(no output)';
        SCENES.c.output = parts[3] ? '鍦烘櫙' + parts[3].trim() : '(no output)';
        SCENES.d.output = parts[4] ? '鍦烘櫙' + parts[4].trim() : '(no output)';
        var active = document.querySelector('.tab.active');
        if (active) showScene(active.dataset.scene);
      })
      .catch(function(e){
        outPre.textContent = 'WASM load failed: ' + e.message + '\n(must be served over HTTP)';
      });
  })();
